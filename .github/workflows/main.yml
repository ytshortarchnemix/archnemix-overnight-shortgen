name: Check Docker Image Size
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      - name: Pull image
        run: |
          docker pull ghcr.io/${{ secrets.CR_USER }}/archnemix-shortgen-core-reddit:latest

      - name: Check image size
        run: |
          echo "============================================================"
          echo "IMAGE SIZE REPORT"
          echo "============================================================"

          BYTES=$(docker image inspect ghcr.io/${{ secrets.CR_USER }}/archnemix-shortgen-core-reddit:latest --format='{{.Size}}')
          echo "Raw bytes: $BYTES"

          python3 -c "
          b = $BYTES
          print(f'Uncompressed size: {b/1024/1024:.1f} MB')
          print(f'Uncompressed size: {b/1024/1024/1024:.3f} GB')
          "

          echo ""
          echo "Layer breakdown:"
          docker history ghcr.io/${{ secrets.CR_USER }}/archnemix-shortgen-core-reddit:latest \
            --format "{{.Size}}\t{{.CreatedBy}}" | head -30

          echo ""
          echo "Runner disk after pull:"
          df -h /
          echo "============================================================"
